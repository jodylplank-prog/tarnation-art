<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarnation Art</title>
<meta name="description" content="A gallery of original dark, tattoo-inspired artwork prints by Tarnation Art.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <h1 class="site-title">TARNATION ART</h1>
  <p class="site-subtitle">Original artwork &amp; prints</p>
</header>

<main id="gallery" class="gallery" aria-label="Artwork gallery">
  <!-- piece cards injected by app.js -->
</main>

<div id="lightbox" class="lightbox" hidden>
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Previous piece">&#8249;</button>
  <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next piece">&#8250;</button>

  <div class="lightbox-content" id="lightboxContent">
    <!-- filled by app.js -->
  </div>
</div>

<footer class="site-footer">
  <p>&copy; <span id="year"></span> Tarnation Art. All artwork shown is for viewing only &mdash; not for reproduction.</p>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
